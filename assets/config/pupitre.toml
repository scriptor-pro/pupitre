# Configuration de Pupitre
#
# Ce fichier est relu automatiquement dès qu'il est enregistré : pas besoin de redémarrer.
# En cas d'erreur, Pupitre garde la configuration précédente et indique la ligne fautive.
# Une ligne qui commence par # est un commentaire. Supprimer une ligne = revenir à la valeur par défaut.

# Police et taille du texte, ex. "B612 Mono 11", "Atkinson Hyperlegible Mono 12", "Iosevka 13".
# Fournies avec Pupitre : B612 Mono et Atkinson Hyperlegible Mono.
# Si la police n'est pas installée, Pupitre revient à B612 Mono (fournie).
police = "B612 Mono 11"

# Thème de couleurs :
#   "systeme"  suit le réglage clair/sombre du bureau
#   "sombre"   thème sombre (Catppuccin Mocha ajusté)
#   "clair"    thème clair (Catppuccin Latte ajusté)
#   "/chemin/vers/theme.toml" ou "~/chemin/theme.toml"   votre propre thème
# Tous les thèmes sont vérifiés : contraste d'au moins 4,5:1 pour le texte (WCAG AA).
theme = "systeme"

# Curseur clignotant : true (oui) ou false (non, recommandé pour l'accessibilité).
curseur_clignote = false

# Nombre de lignes gardées en mémoire pour remonter dans l'historique (0 à 1 000 000).
# Rien n'est écrit sur le disque.
historique_lignes = 10000

# Zoom maximum autorisé avec Ctrl+plus, en pourcentage (100 à 500).
zoom_max_pourcent = 200

# Langue de l'interface : "" (langue du système), "fr", "en", "es", "it", "de" ou "nl".
# S'applique au prochain lancement de Pupitre.
langue = ""

# Shell des nouveaux onglets : "" (shell de connexion de votre compte), un nom ("fish", "zsh")
# ou un chemin ("/usr/bin/fish"). Si le shell est introuvable, Pupitre le dit et utilise le
# shell de connexion. La commande « pupitre shells » liste les shells installés.
shell = ""

# Invite de commande :
#   "starship"  Pupitre fournit une invite Starship accessible (si Starship est installé) ;
#               sa configuration est créée dans ~/.config/pupitre/starship.toml
#   "shell"     garder l'invite habituelle du shell
invite = "starship"

# Annonce vocale de la fin des commandes :
#   "longues"  seulement les commandes qui ont duré un moment (recommandé)
#   "toutes"   toutes les commandes
#   "aucune"   aucune annonce
annonce_fin_commande = "longues"

# Copie automatique : le texte sélectionné à la souris est copié dans le presse-papiers
# dès que le bouton est relâché (Ctrl+Maj+V pour le coller). true (oui) ou false (non).
copie_selection = true

# Autres programmes proposés dans le menu « Nouvel onglet avec », lancés tels quels.
# Un bloc [[shells]] par programme : nom affiché, et commande (le premier élément est le
# programme, sans « - » au début). Exemple :
#
# [[shells]]
# nom = "Serveur"
# commande = ["ssh", "serveur"]

# Notifications. Pupitre ne fait jamais de bruit ; chaque événement est signalé sur l'onglet
# (✓ commande réussie, ✗ commande en échec, ● notification d'un programme ou cloche) et, pour
# certains, par une bulle du bureau (le mode « Ne pas déranger » du bureau est respecté).
# Chaque ligne : true (oui) ou false (non).
[notifications]
# Commande finie dans un onglet non affiché : ✓ ou ✗ sur l'onglet. (Si la bulle ci-dessous
# part, l'indicateur est posé même à false : jamais un seul canal.)
fin_commande_onglet = true
# Commande de plus de 10 s finie alors qu'aucune fenêtre de Pupitre n'est active : bulle.
fin_commande_bulle = true
# Notification envoyée par un programme (OSC 9 ou 777) : ● sur l'onglet. (Si la bulle
# ci-dessous part, le ● est posé même à false : jamais un seul canal.)
programme_onglet = true
# La même notification, en bulle du bureau.
programme_bulle = true
# Un programme copie dans le presse-papiers (OSC 52) : accepté et signalé par un message.
# À false, ces copies sont refusées.
presse_papiers = true
# La cloche sonne dans un onglet non affiché : ● sur l'onglet.
cloche_onglet = true
