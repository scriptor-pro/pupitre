[package]
name = "pupitre-fond"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "pupitre_fond"
path = "src/lib.rs"

[[bin]]
name = "pupitre-fond"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
nix = { version = "0.30", features = ["user", "signal", "process", "fs"] }
pupitre-proto = { path = "../proto" }

[dev-dependencies]
tempfile = "3"
