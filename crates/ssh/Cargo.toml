[package]
name = "pupitre-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "pupitre_ssh"
path = "src/lib.rs"

[[bin]]
name = "pupitre-askpass"
path = "src/bin/pupitre-askpass.rs"

[dependencies]
nix = { version = "0.30", features = ["user", "socket", "poll", "fs"] }
glob = "0.3"
zeroize = "1"
pupitre-proto = { path = "../proto" }
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
